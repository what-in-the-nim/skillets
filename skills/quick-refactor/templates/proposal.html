<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} — Quick Refactor</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #192536; background: #f3f5f8; line-height: 1.6; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1120px; margin: auto; padding: 40px 24px 64px; display: flex; flex-direction: column; }
    header { margin-bottom: 24px; }
    .eyebrow { color: #375d91; font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.2; margin: 8px 0; }
    h2 { font-size: 1.3rem; margin-top: 0; }
    h3 { font-size: 1rem; }
    .meta, figcaption { color: #536176; font-size: .9rem; }
    nav { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 24px 0; }
    a { color: #2457a5; text-underline-offset: 3px; }
    section { background: white; border: 1px solid #dce2ea; border-radius: 12px; padding: 24px; margin: 20px 0; scroll-margin-top: 16px; }
    #recommendation { border-top: 4px solid #375d91; }
    .diagram-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .diagram-card { min-width: 0; margin: 16px 0 0; }
    .diagram-card pre { margin: 0; }
    details { margin-top: 8px; }
    summary { cursor: pointer; color: #2457a5; font-weight: 600; }
    .content ul { margin: 8px 0; padding-left: 22px; }
    .content li + li { margin-top: 6px; }
    .content p { margin: 8px 0; }
    .table-wrap, .diagram { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th, td { padding: 12px; text-align: left; vertical-align: top; border-bottom: 1px solid #dce2ea; min-width: 130px; }
    th { background: #eef3fa; }
    pre { padding: 16px; background: #f3f5f8; border-radius: 8px; overflow-x: auto; line-height: 1.5; }
    code { font-family: ui-monospace, monospace; font-size: .9em; color: #8b3a62; background: #f8edf3; padding: .12em .32em; border-radius: 4px; }
    pre code { color: inherit; background: none; padding: 0; border-radius: 0; }
    figure { margin: 24px 0; }
    figcaption { margin-bottom: 8px; font-weight: 600; }
    .mermaid { background: white; }
    .diagram svg { height: auto; }
    @media (max-width: 700px) { .diagram-pair { grid-template-columns: 1fr; } }
    @media (max-width: 600px) { main { padding: 24px 12px; } section { padding: 16px; } }
    @media print { body { background: white; } main { max-width: none; padding: 0; } nav { display: none; } section { border: 0; padding: 12px 0; } figure, tr { break-inside: avoid; } }
  </style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Quick refactor · Proposal</div>
    <h1>{{TITLE}}</h1>
    <p class="meta">{{TARGET}} · {{REVISION}} · {{DATE}}</p>
  </header>
  <nav aria-label="Proposal sections">{{NAV_HTML}}</nav>
  {{SECTIONS_HTML}}
</main>
</body>
</html>
