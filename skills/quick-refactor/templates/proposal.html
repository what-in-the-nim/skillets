<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>{{TITLE}} · Quick refactor</title>
<style>
:root { font-family: system-ui, sans-serif; color: #24334b; background: #f6f7fb; line-height: 1.6; --ink: #223653; --muted: #69768b; --line: #dce3ec; --accent: #426bc0; --after: #297d70; }
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 1260px; margin: auto; padding: 52px 32px 72px; }
h1 { font-size: clamp(2rem, 4vw, 3rem); line-height: 1.15; letter-spacing: -.04em; margin: 12px 0 20px; max-width: 900px; }
h2 { font-size: 1.5rem; letter-spacing: -.025em; margin: 0 0 18px; line-height: 1.3; }
h3 { font-size: 1.05rem; margin: 0 0 12px; }
p { margin: 10px 0; }
a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
.eyebrow { font-size: .7rem; text-transform: uppercase; letter-spacing: .13em; font-weight: 750; color: var(--muted); }
.meta, footer { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
.status { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; background: white; font-size: .82rem; }
nav { display: flex; flex-wrap: wrap; gap: 24px; margin: 26px 0; font-size: .9rem; }
section { margin-top: 40px; scroll-margin-top: 24px; }
.recommendation { position: relative; padding: 28px 32px; border-radius: 16px; margin: 30px 0 42px; background: #243d61; color: white; box-shadow: 0 8px 24px #243d6110; }
.recommendation .eyebrow { color: #b3cbf0; }.recommendation h2 { margin: 10px 0; }.recommendation p { max-width: 900px; color: #e0e8f5; }
.choice-list { display: grid; gap: 28px; }
.choice-card { background: white; border: 1px solid var(--line); border-radius: 16px; padding: 30px; box-shadow: 0 3px 14px #25365305; }
.choice-card > h2 { font-size: 1.3rem; margin: 8px 0 12px; }.choice-card > p { max-width: 1000px; }
.badge { display: inline-block; vertical-align: middle; font-size: .68rem; letter-spacing: .02em; margin-left: 12px; color: #345fa6; background: #edf3ff; padding: 4px 9px; border-radius: 20px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.visual-pair { margin: 24px 0; }
.ownership { padding: 22px; min-width: 0; border: 1px solid #e1e6ee; border-radius: 12px; background: #f8f9fc; }
.ownership.before { border-top: 3px solid #aab6c9; }.ownership.after { border-top: 3px solid var(--after); background: #f5faf8; }
.ownership > .eyebrow { margin-bottom: 20px; }.after > .eyebrow { color: var(--after); }
ul, ol { padding-left: 22px; }li + li { margin-top: 8px; }
.flow { list-style: none; padding: 0; margin: 0; counter-reset: step; }
.flow li { counter-increment: step; position: relative; display: flex; align-items: center; min-height: 64px; padding: 15px 18px 15px 58px; background: white; border: 1px solid #dce3ef; border-radius: 9px; box-shadow: 0 2px 6px #21334e04; font-size: .88rem; font-weight: 600; line-height: 1.45; }
.flow li::before { content: counter(step, decimal-leading-zero); position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: .75rem; font-weight: 700; color: #7f90ab; }
.flow li + li { margin-top: 28px; }.flow li:not(:last-child)::after { content: ''; position: absolute; height: 21px; width: 6px; left: calc(50% - 3px); bottom: -25px; background: #a8b7cc; clip-path: polygon(35% 0, 65% 0, 65% 70%, 100% 70%, 50% 100%, 0 70%, 35% 70%); }
.after .flow li { border-color: #c9ded7; }.after .flow li::before { color: var(--after); }.after .flow li:not(:last-child)::after { background: #7aafa0; }
.class-grid { display: grid; gap: 16px; }
.class-box { background: white; border: 1px solid #cad5e5; border-radius: 9px; overflow: hidden; box-shadow: 0 3px 8px #21334e05; }
.class-box > strong { display: block; padding: 13px 16px; background: #edf1f9; border-bottom: 1px solid #d7dfec; font-family: ui-monospace, monospace; font-size: .9rem; overflow-wrap: anywhere; }
.class-box > strong::before { content: 'C'; display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 10px; color: #5779b8; background: white; border-radius: 5px; font-size: .7rem; }
.class-box ul { list-style: none; padding: 12px 16px; margin: 0; font-family: ui-monospace, monospace; font-size: .8rem; color: #536681; }.class-box li::before { content: '·'; color: #8ea2c4; margin-right: 8px; }
.after .class-box { border-color: #c4ddd4; }.after .class-box > strong { background: #e9f4ef; border-color: #d1e5dd; }
.relations { list-style: none; padding: 0; margin: 18px 0 0; }.relations li { display: flex; align-items: center; gap: 10px; font-size: .72rem; }.relation-end { background: white; border: 1px solid #dce3ec; padding: 6px 9px; border-radius: 5px; overflow-wrap: anywhere; min-width: 0; }.relation-link { display: flex; flex: 1; min-width: 60px; flex-direction: column; align-items: center; color: #6c809f; text-align: center; }.relation-link small { font-size: .65rem; }.relation-link > span { font-size: 2rem; line-height: .9; }
.sequence { position: relative; display: grid; gap: 16px 12px; overflow-x: auto; padding: 2px 0 20px; }
.lane { z-index: 2; text-align: center; background: white; border: 1px solid #ccd7e7; padding: 10px 8px; border-radius: 6px; font-size: .75rem; font-weight: 650; }
.lifeline { width: 1px; justify-self: center; border-left: 1px dashed #b6c5d9; z-index: 0; }
.message { position: relative; z-index: 1; min-height: 64px; margin: 0 8px; padding: 8px 10px 15px; background: #f8f9fc; text-align: center; font-size: .72rem; }
.message-path { display: block; font-size: .62rem; color: #7c8da5; }.message strong { display: inline-block; font-weight: 600; color: #3e5577; }.message-arrow { position: absolute; bottom: 5px; left: 0; right: 0; height: 1px; background: #7690b8; }.message-arrow::after { content: ''; position: absolute; right: 0; top: -3px; width: 7px; height: 7px; border-right: 1px solid #7690b8; border-top: 1px solid #7690b8; transform: rotate(45deg); }.message.return .message-arrow::after { left: 0; right: auto; transform: rotate(-135deg); }.message.self-call .message-arrow { left: 20%; right: 20%; height: 8px; background: none; border-right: 1px solid #7690b8; border-bottom: 1px solid #7690b8; }.message.self-call .message-arrow::after { right: auto; left: 0; top: 4px; transform: rotate(-135deg); }
.after .lane { border-color: #bedbce; }.after .message { background: #f5faf8; }.after .message strong { color: #2f6e61; }
.code-card { min-width: 0; border-radius: 10px; overflow: hidden; background: #17263b; color: #e5edf7; }.code-card .eyebrow { color: #c0d2e8; padding: 16px 20px; border-bottom: 1px solid #344359; }pre { margin: 0; padding: 20px; overflow-x: auto; line-height: 1.6; font-size: .82rem; }code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
.support { border-top: 1px solid var(--line); padding-top: 28px; }.support-block { padding: 24px 0; border-bottom: 1px solid var(--line); }.support-block h3 { color: #405776; }.support-block article { padding: 16px 0; border-top: 1px solid #e8edf4; }.support-block p, .support-block ul { max-width: 1000px; }
.selection { padding: 24px 28px; background: #edf3fe; border: 1px solid #d7e3f7; border-radius: 12px; }footer { margin-top: 36px; }
@media (max-width: 900px) { .pair { grid-template-columns: 1fr; } main { padding: 28px 18px; }.choice-card { padding: 22px; } }
@media print { body { background: white; } main { padding: 0; max-width: none; } nav { display: none; }.recommendation { background: white; color: #24334b; box-shadow: none; }.recommendation p, .recommendation .eyebrow { color: #526177; }.choice-card { box-shadow: none; } }
</style>
</head>
<body><main>
<header><div class="eyebrow">Refactor decision brief</div><h1>{{TITLE}}</h1><p class="meta">{{META}}</p><p class="meta">{{REPOSITORY}}</p><p class="status">{{STATUS}}</p></header>
<nav aria-label="Report sections">{{NAV}}</nav>
{{CONTENT}}
<footer>Generated from structured technical content. Source inspection and proposed benefits do not establish runtime behavior.</footer>
</main></body></html>
